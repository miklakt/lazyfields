[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyfields"
version = "0.3.0"
description = "Create pandas table that index collections of JSON, pickle, HDF5 files, loading stored data from disk on demand."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mikhail Laktionov", email = "miklakt@gmail.com"}]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
hdf5 = ["h5py>=3"]

[tool.setuptools]
packages = ["lazyfields", "lazyfields.extra_readers"]
package-dir = {lazyfields = "."}
