[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyfields"
version = "0.4.0"
description = "Create pandas table that index collections of JSON, pickle, HDF5 files, loading stored data from disk on demand."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mikhail Laktionov", email = "miklakt@gmail.com"}]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
hdf5 = ["h5py>=3"]
json = ["orjson>=3"]
fuse = ["mfusepy>=3"]

[project.scripts]
lf-mount = "lazyfields.filesystem.os_mount:main"
lf-browse-fs = "lazyfields.browser.filesystem:main"
lf-browse-table = "lazyfields.browser.table:main"

[tool.setuptools]
packages = ["lazyfields", "lazyfields.browser", "lazyfields.filesystem", "lazyfields.readers"]
package-dir = {lazyfields = "."}
